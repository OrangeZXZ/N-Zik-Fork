name: Backup Signing Secrets (TEMPORARY)

on:
  workflow_dispatch:

jobs:
  backup-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        run: |
          echo "RELEASE_KEYSTORE=${{ secrets.RELEASE_KEYSTORE }}" >> signing_secrets.env
          echo "RELEASE_KEYSTORE_PASSWD=${{ secrets.RELEASE_KEYSTORE_PASSWD }}" >> signing_secrets.env
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> signing_secrets.env
          echo "RELEASE_KEY_PASSWD=${{ secrets.RELEASE_KEY_PASSWD }}" >> signing_secrets.env

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets-backup
          path: signing_secrets.env
          retention-days: 1
