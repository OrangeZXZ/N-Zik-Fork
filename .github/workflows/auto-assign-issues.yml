name: Auto-assign issues

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de lancement'
        required: true
        default: 'manual-scan'
        type: choice
        options:
          - manual-scan
          - current-issue
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issues
        uses: actions/github-script@v7
        with:
          script: |
            const mode = context.eventName === 'workflow_dispatch'
              ? '${{ inputs.mode }}'
              : 'current-issue';

            async function assignIssue(issue) {
              if (!issue) return;
              const labels = (issue.labels || []).map(label => label.name);

              if (labels.includes('bug') || labels.includes('enhancement')) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [issue.user.login]
                });
                console.log(`✅ Issue #${issue.number} assigned to @${issue.user.login}`);
              }
            }

            if (mode === 'manual-scan') {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });

              for (const issue of issues) {
                if (issue.pull_request) continue;
                await assignIssue(issue);
              }
              console.log(`🔎 Manual scan completed over ${issues.length} open issues.`);
            } else {
              await assignIssue(context.payload.issue);
            }
