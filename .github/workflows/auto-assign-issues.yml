name: Auto-assign issues
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de lancement'
        required: true
        default: 'manual-scan'
        type: choice
        options:
          - manual-scan
          - current-issue
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issues
        uses: actions/github-script@v7
        with:
          script: |
            const assignTo = 'NEVARLeVrai';
            const mode = context.eventName === 'workflow_dispatch'
              ? '${{ inputs.mode }}'
              : 'current-issue';

            async function syncAssignees(issue, cleanMode) {
              if (!issue) return;

              const labels = (issue.labels || []).map(l => l.name);
              if (!labels.includes('bug') && !labels.includes('enhancement')) return;

              const currentAssignees = (issue.assignees || []).map(u => u.login);

              if (cleanMode) {
                // Manuel : virer tout le monde sauf moi, puis m'ajouter si absent
                const toRemove = currentAssignees.filter(login => login !== assignTo);
                if (toRemove.length > 0) {
                  await github.rest.issues.removeAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: toRemove,
                  });
                }
                if (!currentAssignees.includes(assignTo)) {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: [assignTo],
                  });
                }
              } else {
                // Auto : juste m'ajouter si je suis pas déjà là
                if (!currentAssignees.includes(assignTo)) {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: [assignTo],
                  });
                }
              }

              console.log(`✅ Issue #${issue.number} synced (mode: ${cleanMode ? 'clean' : 'add-only'})`);
            }

            if (mode === 'manual-scan') {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              for (const issue of issues) {
                if (issue.pull_request) continue;
                await syncAssignees(issue, true);
              }
              console.log(`🔎 Manual scan completed over ${issues.length} open issues.`);
            } else {
              await syncAssignees(context.payload.issue, false);
            }
