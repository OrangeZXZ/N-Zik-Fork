name: Auto-assign issues

on:
  workflow_dispatch:
  issues:
    types: [opened]



permissions:
  issues: write

jobs:
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to creator
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            
            // Auto-assign if it's a bug or enhancement
            if (labels.includes('bug') || labels.includes('enhancement')) {
              github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [issue.user.login]
              });
              
              console.log(`✅ Issue #${issue.number} assigned to @${issue.user.login}`);
            }
