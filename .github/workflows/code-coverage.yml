name: Code Coverage

# Exécuter sur la branche par défaut (pour établir la base) et sur les PR (pour comparer).
# GitHub Code Quality compare la couverture de la PR à celle de la branche par défaut.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# La permission `code-quality: write` est obligatoire pour envoyer les données à GitHub.
permissions:
  contents: read
  code-quality: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code au bon commit (pour que les numéros de lignes correspondent)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # 2. Configuration de Java (JDK 17 est le standard actuel pour Android/Kotlin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Configuration de l'environnement Gradle pour optimiser le build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Exécution des tests et génération du rapport JaCoCo
      # (Assure-toi d'utiliser la bonne tâche selon si tu utilises JaCoCo ou Koverx)
      - name: Run tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport

      # 5. Conversion du rapport JaCoCo vers Cobertura XML (recommandation officielle de GitHub)
      - name: Convert JaCoCo to Cobertura
        run: |
          wget https://raw.githubusercontent.com/rix0rrr/cover2cover/master/cover2cover.py
          python cover2cover.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml src/main/java > cobertura.xml
          
      # 6. Envoi du rapport à GitHub
      # Le bot GitHub postera un résumé de couverture directement sur tes Pull Requests.
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: Kotlin
          label: code-coverage/gradle
