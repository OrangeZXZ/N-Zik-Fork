name: Add labels

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numéro de l'issue à relabelliser"
        required: true
        type: number

permissions:
  issues: write

jobs:
  label-build-type:
    runs-on: ubuntu-latest
    steps:
      - name: Detect build type and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("issue_number"))
              : context.issue.number;

            let body;
            if (context.eventName === "workflow_dispatch") {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              body = issue.body || "";
            } else {
              body = context.payload.issue.body || "";
            }

            // Matches the value right under the "🏗️ Build Type" heading
            const match = body.match(/###\s*🏗️\s*Build Type\s*\n+\s*(.+)/);
            if (!match) {
              console.log("No Build Type field found, skipping.");
              return;
            }

            const value = match[1].trim();
            let label = null;

            if (/^Full/i.test(value)) {
              label = "full";
            } else if (/^Minified/i.test(value)) {
              label = "minified";
            } else if (/^Foss/i.test(value)) {
              label = "foss";
            }

            if (!label) {
              console.log(`Build Type value "${value}" did not match any known type.`);
              return;
            }

            // Remove any previous build-type label before adding the new one
            const buildTypeLabels = ["full", "minified", "foss"];
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            for (const l of currentLabels) {
              if (buildTypeLabels.includes(l.name) && l.name !== label) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: l.name,
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [label],
            });
