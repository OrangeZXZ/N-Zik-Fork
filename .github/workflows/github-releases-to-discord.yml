name: Release to Discord

on:
  release:
    types: [published]

jobs:
  extract-changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.read_changelog.outputs.content }}
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Extract version code
        id: extract_version
        run: |
          versionCode=$(grep -E '^\s*versionCode\s*=' composeApp/build.gradle.kts | sed 's/[^0-9]*//g')
          echo "version=$versionCode" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: read_changelog
        run: |
          changelog_file="fastlane/metadata/android/en-US/changelogs/${{ steps.extract_version.outputs.version }}.txt"
          
          if [ -f "$changelog_file" ]; then
            content=$(cat "$changelog_file")
            content="${content//'%'/'%25'}"
            content="${content//$'\n'/'%0A'}"
            content="${content//$'\r'/'%0D'}"
            echo "content=$content" >> $GITHUB_OUTPUT
          else
            echo "content=No changelog available" >> $GITHUB_OUTPUT
          fi

  notify-beta:
    needs: extract-changelog
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Beta Release Notification
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "16711680"
          username: "🧪 N-Zik Beta"
          avatar_url: "https://raw.githubusercontent.com/NEVARLeVrai/N-Zik/main/assets/discord/fallback_app.png"
          content: "⚠️ **||<@&1345079801324634195>|| BETA VERSION AVAILABLE!**\n🧪 Help us test the latest features!"
          footer_title: "N-Zik BETA • Testing & Feedback Needed"
          footer_icon_url: "https://raw.githubusercontent.com/NEVARLeVrai/N-Zik/main/assets/discord/fallback_app.png"
          footer_timestamp: true
          reduce_headings: true
          max_description: 2048

  notify-stable:
    needs: extract-changelog
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Stable Release Notification
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "13632401"
          username: "🎵 N-Zik Releases"
          avatar_url: "https://raw.githubusercontent.com/NEVARLeVrai/N-Zik/main/assets/discord/fallback_app.png"
          content: "✨ **||<@&1345079801324634195>|| NEW STABLE RELEASE!**\n🚀 Download now!"
          footer_title: "N-Zik • Made by the community, for the community"
          footer_icon_url: "https://raw.githubusercontent.com/NEVARLeVrai/N-Zik/main/assets/discord/fallback_app.png"
          footer_timestamp: true
          reduce_headings: true
          max_description: 2048
