<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #e1e4e8; }
    .text-title { fill: #2b3137; font-weight: 600; font-size: 15px; }
    .chart-line { stroke: #0366d6; fill: none; }
    .chart-dot { fill: #ffffff; stroke: #0366d6; }
    .grad-start { stop-color: #0366d6; stop-opacity: 0.4; }
    .grad-end { stop-color: #0366d6; stop-opacity: 0.0; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text-title { fill: #c9d1d9; }
      .chart-line { stroke: #58a6ff; }
      .chart-dot { fill: #0d1117; stroke: #58a6ff; }
      .grad-start { stop-color: #58a6ff; stop-opacity: 0.3; }
      .grad-end { stop-color: #58a6ff; stop-opacity: 0.0; }
    }
    
    @keyframes pulse {
      0% { r: 4; stroke-width: 2.5; }
      50% { r: 5.5; stroke-width: 4; stroke-opacity: 0.6; }
      100% { r: 4; stroke-width: 2.5; }
    }
    .dot-pulse { animation: pulse 2s infinite; }
    @keyframes draw {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .animated-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.5s ease-out forwards;
    }
  </style>
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05" />
    </filter>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="grad-start"/>
      <stop offset="100%" class="grad-end"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="600" height="160" rx="10" filter="url(#shadow2)" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="25" y="30" class="text-title">📈 Download Growth (Current: 12.8k)</text>
  </g>

  <!-- Area under the line -->
  <path fill="url(#fillGrad)" d="M 35.0,125.0 C 57.08333333333333,125.0 57.08333333333333,120.625 79.16666666666666,120.625 C 101.25,120.625 101.25,108.4375 123.33333333333333,108.4375 C 145.41666666666666,108.4375 145.41666666666666,89.0625 167.5,89.0625 C 189.58333333333331,89.0625 189.58333333333331,78.4375 211.66666666666666,78.4375 C 233.75,78.4375 233.75,76.875 255.83333333333334,76.875 C 277.9166666666667,76.875 277.9166666666667,65.0 300.0,65.0 C 322.08333333333337,65.0 322.08333333333337,59.375 344.1666666666667,59.375 C 366.25,59.375 366.25,52.8125 388.3333333333333,52.8125 C 410.41666666666663,52.8125 410.41666666666663,50.625 432.5,50.625 C 454.58333333333337,50.625 454.58333333333337,47.5 476.6666666666667,47.5 C 498.75,47.5 498.75,42.1875 520.8333333333333,42.1875 C 542.9166666666666,42.1875 542.9166666666666,35.0 565.0,35.0 L 565.0,125 L 35.0,125 Z" />

  <!-- Main curve -->
  <path d="M 35.0,125.0 C 57.08333333333333,125.0 57.08333333333333,120.625 79.16666666666666,120.625 C 101.25,120.625 101.25,108.4375 123.33333333333333,108.4375 C 145.41666666666666,108.4375 145.41666666666666,89.0625 167.5,89.0625 C 189.58333333333331,89.0625 189.58333333333331,78.4375 211.66666666666666,78.4375 C 233.75,78.4375 233.75,76.875 255.83333333333334,76.875 C 277.9166666666667,76.875 277.9166666666667,65.0 300.0,65.0 C 322.08333333333337,65.0 322.08333333333337,59.375 344.1666666666667,59.375 C 366.25,59.375 366.25,52.8125 388.3333333333333,52.8125 C 410.41666666666663,52.8125 410.41666666666663,50.625 432.5,50.625 C 454.58333333333337,50.625 454.58333333333337,47.5 476.6666666666667,47.5 C 498.75,47.5 498.75,42.1875 520.8333333333333,42.1875 C 542.9166666666666,42.1875 542.9166666666666,35.0 565.0,35.0" class="chart-line animated-line" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bright endpoint dot -->
