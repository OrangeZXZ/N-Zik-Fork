    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="grad-start"/>
      <stop offset="100%" class="grad-end"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="600" height="160" rx="10" filter="url(#shadow2)" stroke-width="1"/>
