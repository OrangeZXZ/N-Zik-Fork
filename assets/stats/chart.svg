<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #e1e4e8; }
    .text-title { fill: #2b3137; font-weight: 600; font-size: 15px; }
    .chart-line { stroke: #0366d6; fill: none; }
    .chart-dot { fill: #ffffff; stroke: #0366d6; }
    .grad-start { stop-color: #0366d6; stop-opacity: 0.4; }
    .grad-end { stop-color: #0366d6; stop-opacity: 0.0; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text-title { fill: #c9d1d9; }
      .chart-line { stroke: #58a6ff; }
      .chart-dot { fill: #0d1117; stroke: #58a6ff; }
      .grad-start { stop-color: #58a6ff; stop-opacity: 0.3; }
      .grad-end { stop-color: #58a6ff; stop-opacity: 0.0; }
    }
    
    @keyframes pulse {
      0% { r: 4; stroke-width: 2.5; }
      50% { r: 5.5; stroke-width: 4; stroke-opacity: 0.6; }
      100% { r: 4; stroke-width: 2.5; }
    }
    .dot-pulse { animation: pulse 2s infinite; }
    @keyframes draw {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .animated-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1.5s ease-out forwards;
    }
  </style>
